name: FuoriQuota Bot Giornaliero

on:
  schedule:
    - cron: '0 7 * * *' # 09:00 italiane (07:00 UTC) - POST MATTINA: Early value 24-48h prima
    - cron: '0 12 * * *' # 14:00 italiane (12:00 UTC) - POST POMERIGGIO: Analisi + news infortuni
    - cron: '45 18 * * *' # 20:45 italiane (18:45 UTC) - POST SERA: Formazioni ufficiali + drop finale
  workflow_dispatch: # per lanciarlo a mano quando vuoi

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
